<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蘿絲莉莉 - 前台點餐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f0;}
.app{max-width:900px;margin:0 auto;background:#fff;min-height:100vh;}
.header{padding:14px 16px;border-bottom:1px solid #eee;}
.brand-name{font-size:16px;font-weight:600;color:#111;}
.brand-sub{font-size:11px;color:#888;}
.top-row{display:flex;align-items:center;gap:14px;padding:12px 16px 0;flex-wrap:wrap;}
.top-row label{font-size:13px;color:#666;white-space:nowrap;}
.top-row input[type=text]{padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;width:70px;}
.beef-opt{display:flex;gap:14px;}
.beef-opt label{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;}
.pickup-row{display:flex;align-items:center;gap:14px;padding:10px 16px 0;flex-wrap:wrap;}
.pickup-row label{font-size:13px;color:#666;white-space:nowrap;}
.pickup-row select{flex:1;max-width:300px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;}
.cat-nav{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:#fff;z-index:4;border-bottom:1px solid #f0f0f0;}
.cat-nav::-webkit-scrollbar{display:none;}
.cat-btn{padding:6px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:12px;font-weight:500;color:#555;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.cat-btn:hover{border-color:#1D9E75;color:#1D9E75;}
.menu-area{padding:0 16px;}
.cat-bar{display:flex;gap:8px;padding:12px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:12px;font-weight:500;color:#666;cursor:pointer;white-space:nowrap;}
.cat-btn:hover{border-color:#1D9E75;color:#1D9E75;}
.series-banner{margin:16px 0 4px;border-radius:12px;overflow:hidden;}
.series-banner img{width:100%;display:block;border-radius:12px;}
.series-title{font-size:13px;font-weight:600;margin:16px 0 4px;padding:6px 12px;border-radius:8px;}
.s-4m{background:#FBEAF0;color:#993556;}.s-6m{background:#FAECE7;color:#993C1D;}
.s-10m{background:#E1F5EE;color:#0F6E56;}.s-12m{background:#EEEDFE;color:#534AB7;}
.s-18m{background:#E6F1FB;color:#185FA5;}.s-meat{background:#FAEEDA;color:#854F0B;}
.bundle-hint{font-size:14px;color:#666;margin:2px 0 6px 2px;font-weight:500;}
.prog-wrap{height:4px;background:#eee;border-radius:2px;margin-bottom:10px;}
.prog-bar{height:100%;background:#1D9E75;border-radius:2px;transition:width 0.3s;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px;margin-bottom:4px;}
.menu-item{background:#fff;border:1px solid #eee;border-radius:12px;padding:11px 12px;cursor:pointer;transition:border-color 0.15s,box-shadow 0.15s;}
.menu-item:hover{border-color:#1D9E75;box-shadow:0 2px 8px rgba(29,158,117,0.12);}
.item-name{font-size:12px;font-weight:600;color:#111;margin-bottom:4px;line-height:1.4;}
.item-desc{font-size:10px;color:#aaa;line-height:1.5;margin-bottom:6px;}
.item-price{font-size:13px;font-weight:600;color:#1D9E75;}
.item-qty-badge{margin-top:6px;font-size:12px;font-weight:600;color:#fff;background:#1D9E75;border-radius:20px;padding:2px 10px;display:inline-block;}
.item-qty-badge{display:none;margin-top:6px;font-size:12px;font-weight:600;color:#fff;background:#1D9E75;border-radius:6px;padding:3px 8px;text-align:center;}
.item-qty-badge.show{display:block;}
.cart-box{background:#f8f8f5;border-radius:12px;padding:14px;margin:14px 16px;}
.cart-title{font-size:14px;font-weight:600;color:#111;margin-bottom:11px;}
.cart-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ci-name{flex:1;font-size:12px;color:#111;line-height:1.4;}
.ci-series{font-size:10px;color:#aaa;}
.qty-btn{width:24px;height:24px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#111;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.bundle-applied{background:#E1F5EE;border-radius:8px;padding:9px 12px;margin:9px 0;font-size:12px;color:#0F6E56;}
.b-row{display:flex;justify-content:space-between;margin-bottom:3px;}
.ci-price{min-width:52px;text-align:right;font-size:12px;color:#888;}
.contact-row{display:flex;gap:8px;margin-top:12px;}
.contact-row input{flex:1;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:12px;background:#fff;}
.contact-row label{font-size:12px;color:#666;display:block;margin-bottom:5px;}
.remark-row{margin-top:10px;}
.remark-row label{font-size:12px;color:#666;display:block;margin-bottom:5px;}
.remark-row textarea{width:100%;height:60px;font-size:12px;resize:none;border-radius:8px;border:1px solid #ddd;padding:8px;background:#fff;}
.divider{border-top:1px solid #e5e5e5;margin-top:12px;padding-top:12px;}
.total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
.total-label{font-size:13px;color:#888;}
.total-final{font-size:20px;font-weight:700;color:#111;}
.save-tag{font-size:13px;color:#1D9E75;font-weight:600;}
.order-btn{width:100%;margin-top:12px;padding:13px;background:#1D9E75;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
.order-btn:disabled{background:#aaa;cursor:not-allowed;}
.empty-cart{font-size:13px;color:#aaa;text-align:center;padding:16px 0;}
.success-banner{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(29,158,117,0.96);color:#fff;display:none;align-items:center;justify-content:center;z-index:200;flex-direction:column;gap:16px;}
.success-banner.show{display:flex;}
.s-icon{font-size:80px;}
.s-text{font-size:30px;font-weight:700;}
.s-num{font-size:18px;opacity:0.9;}
@media(max-width:500px){.menu-grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="app">
<div id="successBanner" class="success-banner"><div class="s-icon">✓</div><div class="s-text">訂單送出成功！</div><div class="s-num" id="successNum"></div></div>
<div class="header">
  <div class="brand-name">蘿絲莉莉嬰兒副食品</div>
  <div class="brand-sub">冷凍鮮食副食品菜單</div>
</div>
<div class="top-row">
  <label>取餐號</label><input type="text" id="tnum" value="..." readonly style="background:#f0f0f0;color:#333;font-weight:600;font-size:15px;text-align:center;width:70px;cursor:default;"/>
  <label>飲食</label>
  <div class="beef-opt">
    <label><input type="radio" name="bf" value="all" checked onchange="renderMenu()"> 吃牛</label>
    <label><input type="radio" name="bf" value="no" onchange="renderMenu()"> 不吃牛</label>
  </div>
</div>
<div class="pickup-row">
  <label>取貨時間</label>
  <select id="pickupTime"></select>
</div>
<div class="cat-bar" id="catBar"></div>
<div id="catNav" class="cat-nav"></div>
<div class="menu-area" id="menuArea"></div>
<div class="cart-box">
  <div class="cart-title">購物車</div>
  <div id="cItems"></div>
  <div id="cEmpty" class="empty-cart">尚未點餐，請從上方選取</div>
  <div id="bInfo"></div>
  <div class="contact-row">
    <div style="flex:1"><label>姓名（選填）</label><input type="text" id="cname" placeholder=""/></div>
    <div style="flex:1"><label>電話（選填）</label><input type="tel" id="cphone" placeholder=""/></div>
  </div>
  <div class="remark-row"><label>備註</label><textarea id="rmk"></textarea></div>
  <div id="cTotalSec" style="display:none">
    <div class="divider">
      <div class="total-row"><span class="total-label">原價</span><span id="origT" style="font-size:14px;color:#888">$0</span></div>
      <div class="total-row" id="saveRow" style="display:none"><span class="total-label">套組優惠</span><span class="save-tag" id="saveAmt">-$0</span></div>
      <div class="total-row"><span class="total-label" style="font-weight:600">合計</span><span class="total-final" id="cTotal">$0</span></div>
    </div>
  </div>
  <button class="order-btn" id="orderBtn" onclick="submitOrder()">送出訂單</button>
</div>
</div>

const HOURS = {
  1: [{s:11,e:15}],  // 週一
  2: [{s:11,e:15}],  // 週二
  3: [{s:11,e:15}],  // 週三

function buildTimeSlots() {
  const sel = document.getElementById('pickupTime');
  sel.innerHTML = '';
  const now = new Date();
  const slots = [];

  // 現場訂單 option
  const onsite = document.createElement('option');
  onsite.value = 'onsite';
  onsite.textContent = '現場訂單';
  sel.appendChild(onsite);

  // Generate slots for today + next 14 days
  for (let d = 0; d < 14; d++) {
    const date = new Date(now);
    date.setDate(now.getDate() + d);
    const dow = date.getDay(); // 0=Sun
    const ranges = HOURS[dow];
    if (!ranges) continue;

    const dateStr = (date.getMonth()+1) + '/' + date.getDate();
    const dowNames = ['日','一','二','三','四','五','六'];
    const label = d === 0 ? '今天' : d === 1 ? '明天' : `${dateStr}(週${dowNames[dow]})`;

    ranges.forEach(({s, e}) => {
      for (let h = s; h < e; h++) {
        for (let m = 0; m < 60; m += 30) {
          // Skip if within 30min from now (same day)
          if (d === 0) {
            const slotMin = h * 60 + m;
            const nowMin = now.getHours() * 60 + now.getMinutes() + 30;
            if (slotMin < nowMin) continue;
          }
          const timeStr = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
          slots.push({ value: `${date.toISOString().slice(0,10)} ${timeStr}`, label: `${label} ${timeStr}` });
        }
      }
    });
  }

  if (slots.length === 0) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '近期無可選時段';
    sel.appendChild(opt);
  } else {
    slots.forEach(({value, label}) => {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      sel.appendChild(opt);
    });
  }
}


function buildCatBar(){
  const bar=document.getElementById('catBar');
  if(!bar)return;
  const grouped={};menu.forEach(m=>{grouped[m.series]=grouped[m.series]||[];grouped[m.series].push(m);});
  bar.innerHTML=SORDER.filter(s=>grouped[s]).map(s=>{
    const shortName=s.replace(/\s*米粹食物泥|\s*小寶寶粥|\s*大寶寶粥|\s*低調味副食品|\s*飯麵|\s*大寶寶炊飯/g,'').trim();
    const sid2=s.replace(/[^a-zA-Z0-9]/g,'');
    return `<button class="cat-btn" onclick="scrollToSeries('${sid2}')">${shortName}</button>`;
  }).join('');
}

function updateAllBadges(){

    el.classList.toggle('show',q>0);

function isNoBeef(){return document.querySelector('input[name=bf]:checked').value==='no';}
function calcDiscount(){
  const sq={};Object.keys(cart).forEach(id=>{const m=menu.find(x=>x.id==id);if(m)sq[m.series]=(sq[m.series]||0)+cart[id];});
  let total=0;const details=[];
  Object.keys(sq).forEach(s=>{
    if(!BUNDLES[s])return;let rem=sq[s],saving=0;
    const tiers=[...BUNDLES[s]].sort((a,b)=>b.q-a.q);const used=[];
    tiers.forEach(t=>{while(rem>=t.q){const up=menu.find(m=>m.series===s)?.price||0;const sv=t.q*up-t.p;saving+=sv;used.push({q:t.q,p:t.p,sv});rem-=t.q;}});
    if(saving>0){details.push({s,used,saving});total+=saving;}
  });
  return{total,details};
}
function sid(s){return s.replace(/[^a-zA-Z0-9]/g,'');}
function updateProgress(){
  const sq={};Object.keys(cart).forEach(id=>{const m=menu.find(x=>x.id==id);if(m)sq[m.series]=(sq[m.series]||0)+cart[id];});
  SORDER.forEach(s=>{
    const bar=document.getElementById('bar-'+sid(s)),lbl=document.getElementById('lbl-'+sid(s));
    if(!bar||!lbl)return;const tiers=BUNDLES[s];if(!tiers)return;
    const qty=sq[s]||0,maxQ=tiers[tiers.length-1].q;
    bar.style.width=Math.min(qty/maxQ*100,100)+'%';
    const next=tiers.find(t=>t.q>qty);
    const priceInfo=tiers.map(t=>t.q+'入$'+t.p).join(' / ');
    if(next){
      lbl.textContent=qty>0?`已選 ${qty} 包，再 ${next.q-qty} 包可享 ${next.q}入$${next.p} 套組價`:`套組優惠：${priceInfo}`;
    } else {
      lbl.textContent=`套組優惠：${priceInfo}（可繼續加購循環套組）`;
    }
  });
}
function renderMenu(){
  const grouped={};menu.forEach(m=>{grouped[m.series]=grouped[m.series]||[];grouped[m.series].push(m);});
  let html='';
  SORDER.forEach(s=>{
    if(!grouped[s])return;const cls=SCLS[s]||'s-4m';const id=sid(s);const imgSrc=SERIES_IMGS[s];
    if(imgSrc)html+=`<div class="series-banner" id="series-${id}"><img src="${imgSrc}" alt="${s}" loading="lazy"/></div>`;
    else html+=`<div class="series-title ${cls}" id="series-${id}">${s}</div>`;
    if(BUNDLES[s]){html+=`<div class="bundle-hint" id="lbl-${id}">${BUNDLES[s].map(t=>t.q+'入$'+t.p).join(' / ')}</div><div class="prog-wrap"><div class="prog-bar" id="bar-${id}" style="width:0%"></div></div>`;}
    html+=`<div class="menu-grid">`;
    grouped[s].forEach(item=>{
      const hide=(isNoBeef()&&BEEF.includes(item.name))?'style="display:none"':'';
      html+=`<div class="menu-item" id="item-card-${item.id}" onclick="addC(${item.id})" ${hide}><div class="item-name">${item.name}</div>${item.desc?`<div class="item-desc">${item.desc}</div>`:''}<div class="item-price">$${item.price} / 包</div><div class="item-qty-badge" id="iqb-${item.id}"></div></div>`;
    });
    html+='</div>';
  });
  document.getElementById('menuArea').innerHTML=html;updateProgress();buildCatBar();updateAllBadges();
}
function addC(id){cart[id]=(cart[id]||0)+1;renderCart();updateProgress();updateAllBadges();}
function chgQ(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart();updateProgress();updateAllBadges();}
function renderCart(){
  const keys=Object.keys(cart);
  const ci=document.getElementById('cItems'),ce=document.getElementById('cEmpty'),cs=document.getElementById('cTotalSec'),bi=document.getElementById('bInfo');
  if(!keys.length){ci.innerHTML='';ce.style.display='block';cs.style.display='none';bi.innerHTML='';return;}
  ce.style.display='none';cs.style.display='block';let orig=0;
  ci.innerHTML=keys.map(id=>{const m=menu.find(x=>x.id==id);if(!m)return'';const sub=m.price*cart[id];orig+=sub;
    return`<div class="cart-item"><span class="ci-name">${m.name}<br><span class="ci-series">${m.series}</span></span><div style="display:flex;align-items:center;gap:6px"><button class="qty-btn" onclick="chgQ(${id},-1)">−</button><span style="font-size:13px;min-width:18px;text-align:center">${cart[id]}</span><button class="qty-btn" onclick="chgQ(${id},1)">+</button></div><span class="ci-price">$${sub}</span></div>`;
  }).join('');
  document.getElementById('origT').textContent='$'+orig;
  const{total:disc,details}=calcDiscount();
  if(details.length){let bh='<div class="bundle-applied">';details.forEach(d=>d.used.forEach(u=>{bh+=`<div class="b-row"><span>${d.s}｜${u.q}入套組</span><span style="font-weight:600">省 $${u.sv}</span></div>`;}));bh+='</div>';bi.innerHTML=bh;document.getElementById('saveRow').style.display='flex';document.getElementById('saveAmt').textContent='-$'+disc;}
  else{bi.innerHTML='';document.getElementById('saveRow').style.display='none';}
  document.getElementById('cTotal').textContent='$'+(orig-disc);
}
async function submitOrder(){
  const keys=Object.keys(cart);if(!keys.length){alert('請先選擇商品');return;}
  const tbl=document.getElementById('tnum').value||'未知';
  const rmk=document.getElementById('rmk').value.trim();
  const cname=document.getElementById('cname').value.trim();
  const cphone=document.getElementById('cphone').value.trim();
  const bf=isNoBeef()?'不吃牛':'吃牛';
  const pickupSel=document.getElementById('pickupTime');
  const pickupVal=pickupSel.value;
  const pickupLabel=pickupVal==='onsite'?'現場訂單':pickupVal?'取貨：'+pickupSel.options[pickupSel.selectedIndex].text:'未選擇時間';
  const items=keys.map(id=>{const m=menu.find(x=>x.id==id);return{name:m.name,series:m.series,qty:cart[id],price:m.price};});
  const orig=items.reduce((s,i)=>s+i.price*i.qty,0);
  const{total:disc,details}=calcDiscount();const final=orig-disc;
  const now=new Date();const t=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  const btn=document.getElementById('orderBtn');btn.disabled=true;btn.textContent='送出中...';
  try{
    const res=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tbl,items,orig,disc,final,t,done:false,rmk,bf,bdetails:details,pickup:pickupLabel,cname,cphone})});
    if(res.ok){
      cart={};document.getElementById('rmk').value='';document.getElementById('cname').value='';document.getElementById('cphone').value='';fetchTicket();renderCart();updateProgress();
      document.getElementById('successNum').textContent='取餐號：'+tbl;
      const b=document.getElementById('successBanner');b.classList.add('show');
      setTimeout(()=>b.classList.remove('show'),2500);
    }
    else alert('送出失敗，請重試');
  }catch{alert('無法連線到伺服器');}
  btn.disabled=false;btn.textContent='送出訂單';
}
function updateItemBadges(){
  menu.forEach(item=>{
    const card=document.getElementById('card-'+item.id);
    if(!card) return;
    const qty=cart[item.id]||0;
    let badge=card.querySelector('.item-qty-badge');
    if(qty>0){
      if(!badge){badge=document.createElement('div');badge.className='item-qty-badge';card.appendChild(badge);}
      badge.textContent='已選 '+qty+' 個';
    } else {
      if(badge) badge.remove();
    }
  });
}

async function fetchTicket(){
  try{

    const d=await r.json();
    document.getElementById('tnum').value=d.ticket;
  }catch{
    document.getElementById('tnum').value='--';
  }
}
